// Transport envelope for the interactive QuantLib service, schema v2.
//
// One serialized ClientFrame or ServerFrame per binary WebSocket message.
// WebSocket already delimits messages, so no length prefix is added.
//
// The frame layer is v1's unchanged, and deliberately so: the lifecycle, the
// request_id correlation, the one-terminal-frame-per-request rule and the
// cancel path are the parts of v1 that were right. What v2 changes is
// everything below the frame — the market, the instruments, the engine and
// the results — and none of that is wire-compatible, which is why it is a new
// package rather than new fields (DESIGN §6.2).

syntax = "proto3";

package quantlib.v2;

import "quantlib/v1/conventions.proto";
import "quantlib/v2/engine.proto";
import "quantlib/v2/instrument.proto";
import "quantlib/v2/market.proto";
import "quantlib/v2/results.proto";

option java_multiple_files = true;
option go_package = "quantlib/v2;quantlibv2";

// ---------------------------------------------------------------------------
// Frames
// ---------------------------------------------------------------------------

// Client -> server.
message ClientFrame {
    // Correlates responses with this request. Unique per connection, chosen by
    // the client, never reused; the server echoes it on every frame it sends
    // in reply, including Progress frames and the terminal one.
    uint64 request_id = 1;

    // The session this frame acts on. Empty only on OpenSession.
    string session_id = 2;

    oneof payload {
        OpenSession open_session = 10;
        CloseSession close_session = 11;
        UpdateMarket update_market = 12;
        PriceRequest price = 13;
        CancelRequest cancel = 14;
        Hello hello = 15;
        PriceBatch batch = 16;
        ResumeSession resume_session = 17;
    }
}

// Server -> client.
message ServerFrame {
    uint64 request_id = 1;

    // Set on the last frame for this request_id, whether it succeeded or
    // failed. Every request gets exactly one, including a cancel and
    // including a rejection: a client that never sees one waits forever
    // (DESIGN §9.5).
    bool terminal = 2;

    // Every frame names its session. A terminal error can arrive when the
    // client has several sessions in flight on one socket, and request_id
    // alone does not say which graph it concerns.
    string session_id = 3;

    oneof payload {
        SessionOpened session_opened = 10;
        Ack ack = 11;
        Progress progress = 12;
        PriceResult price_result = 13;
        Error error = 14;
        ScenarioResult scenario_result = 15;
        Capabilities capabilities = 16;
        BatchResult batch_result = 17;
    }
}

// ---------------------------------------------------------------------------
// Lifecycle
// ---------------------------------------------------------------------------

message OpenSession {
    // The date everything in this session prices against. Written to the
    // worker thread's own Settings::evaluationDate() by the Session
    // constructor, on that thread, and never read from a clock anywhere else
    // — replay has to reproduce the graph exactly (DESIGN §2, §2.1).
    quantlib.v1.Date evaluation_date = 1;

    // The whole market, in dependency order. v1 had separate quote and curve
    // lists; one ordered list of MarketObject replaces both, because a curve
    // may depend on a quote, a spreaded curve on a curve, a local-vol surface
    // on a Black one, and an index on all of them.
    repeated MarketObject market = 2;

    // Free-text, echoed in logs. Never interpreted.
    string client_label = 3;
}

message SessionOpened {
    string session_id = 1;
    double bootstrap_seconds = 2;
    // What was actually built, in the order it was built. A client that
    // posted forty objects and got thirty-nine can see which one is missing
    // without diffing its own request.
    repeated string market_ids = 3;

    // The bearer secret for ResumeSession, minted by the gateway and never
    // reused. It is the only thing between this session and any other page on
    // the machine, since a WebSocket upgrade is not subject to the same-origin
    // policy (DESIGN §9.6) — hold it in memory, do not log it, and do not put
    // it in a URL. Empty when the service is running with the grace window
    // turned off, which is how a client learns resume is not on offer.
    string resume_token = 4;

    // How long this session outlives its socket. Zero means it does not.
    uint32 resume_grace_seconds = 5;

    // True when this frame answers a ResumeSession rather than an
    // OpenSession: the same session, the same graph, the same id. The other
    // fields are what the original open reported, replayed — bootstrap_seconds
    // is what the bootstrap cost then and not a second one now.
    bool resumed = 6;
}

// Take back a session whose socket died, within its grace window.
//
// The session, its graph and its worker seat outlive the socket for
// `resume_grace_seconds`, and so does whatever was running in it: a Monte
// Carlo that was half way through when the network blinked keeps running, and
// its terminal frame is held for the client that comes back for it
// (DESIGN §9.4).
//
// A resume that is refused — wrong token, expired window, a session that was
// closed rather than dropped — is SESSION_NOT_FOUND, the same answer for all
// of them so that a wrong token cannot be told apart from an absent one. The
// client's move is the same in every case: open a session and replay.
message ResumeSession {
    string session_id = 1;
    string resume_token = 2;
}

message CloseSession {}

// ---------------------------------------------------------------------------
// Market updates
// ---------------------------------------------------------------------------

// Writes quotes, and only quotes.
//
// The whole batch runs under one UpdateGuard so dependent instruments
// recalculate once rather than once per quote — and the guard must call
// disableUpdates(true), because the default drops notifications instead of
// deferring them and leaves the next price stale with no error (DESIGN §5).
//
// Anything that is not a quote write — a new curve shape, a new index — is a
// new session. That is not a limitation of the schema: a session is pinned to
// one thread for life and its graph is what replay reproduces, so rebuilding
// the graph is a CloseSession plus a replay (DESIGN §2.1).
message UpdateMarket {
    message QuoteWrite {
        string quote_id = 1;
        double value = 2;
    }
    repeated QuoteWrite quotes = 1;

    // Past fixings can be added to a live session; they are graph input but
    // not graph structure, and a leg that could not price without one should
    // not need a new session to get it.
    repeated FixingSeries fixings = 2;

    // Forces a bootstrap even when nothing a curve depends on moved.
    bool force_rebootstrap = 3;
}

// ---------------------------------------------------------------------------
// Pricing
// ---------------------------------------------------------------------------

message PriceRequest {
    Instrument instrument = 1;
    Engine engine = 2;

    // What to compute besides the NPV. One the engine cannot supply comes
    // back named in PriceResult.unavailable_results rather than as a missing
    // key: a frontend that asked for vega and got a map without it cannot
    // tell that from a vega of zero. The price is still returned.
    repeated ResultKind results = 3;

    // Also return everything the engine published in its own
    // additionalResults map. Off by default because the contents vary by
    // engine and a client cannot rely on them; on, it is how a panel shows
    // the working behind a price.
    bool include_additional_results = 4;

    // Return the cash-flow table. Cash-flow instruments only.
    bool include_cashflows = 5;

    // Curves and surfaces sampled for plotting, alongside the price.
    repeated CurveSample curve_samples = 6;

    // Price once per scenario point instead of once. The reply is a
    // ScenarioResult rather than a PriceResult.
    //
    // More than one is a grid rather than a lockstep shift; see Scenario. The
    // tag is the one the singular field used, because a singular message field
    // parses as a one-element repeated one and a sweep of one quote is a grid
    // with one axis.
    repeated Scenario scenarios = 7;

    // Required when RESULT_KIND_IMPLIED_VOLATILITY is asked for, because the
    // question needs a price to invert and nothing else in this message is
    // one. Inverting the price that was just computed would return the
    // volatility that went in.
    ImpliedVolatility implied_volatility = 8;

    // v1 carried progress_every_paths here. It lives on McParameters in v2:
    // it changes the answer, so it belongs with the seed and the sample count
    // that the result echoes, not with the reporting options.
}

// A curve or surface sampled onto a grid, for the frontend to draw.
//
// The alternative is shipping the term structure itself and re-implementing
// its interpolation in TypeScript, which is how a frontend ends up drawing a
// curve the backend did not price with.
message CurveSample {
    // The MarketObject to sample.
    string market_id = 1;

    enum Quantity {
        QUANTITY_UNSPECIFIED = 0;
        QUANTITY_ZERO_RATE = 1;
        QUANTITY_DISCOUNT_FACTOR = 2;
        QUANTITY_FORWARD_RATE = 3;
        QUANTITY_SURVIVAL_PROBABILITY = 4;
        QUANTITY_HAZARD_RATE = 5;
        QUANTITY_BLACK_VOLATILITY = 6;
        QUANTITY_LOCAL_VOLATILITY = 7;
        QUANTITY_VARIANCE = 8;
    }
    Quantity quantity = 2;

    // Exactly one. Dates are the honest form for a yield curve; times suit a
    // volatility slice.
    repeated quantlib.v1.Date dates = 3;
    repeated double times = 4 [packed = true];

    // Volatility surfaces only: the strikes to sample at. More than one
    // strike makes the result a DoubleMatrix rather than a Series.
    repeated double strikes = 5 [packed = true];

    // Rate quantities only.
    quantlib.v1.Compounding compounding = 6;
    quantlib.v1.Frequency frequency = 7;
    quantlib.v1.DayCounter day_counter = 8;
}

// One axis of a sweep.
//
// One request, one graph, N lazy recomputes of only what each write
// invalidated. The point of keeping a session alive is that this costs far
// less than N requests, and the frontend's spot ladder is the case that makes
// it obvious.
//
// Several axes sweep as a product, not in lockstep: spot at 21 points against
// vol at 5 is 105 prices, in row-major order with the last axis varying
// fastest. That is the shape a spot x vol surface has, and asking for it as
// five separate sweeps costs five round trips and five progress streams to say
// the same thing on the same warm graph.
//
// A lockstep shift -- move these three quotes together -- is a different
// question and is not this one. It is a market edit with an undo, which
// UpdateMarket already does.
message Scenario {
    string quote_id = 1;

    // Exactly one form.
    oneof points {
        Explicit explicit = 2;
        Linear linear = 3;
        Relative relative = 4;
    }
    message Explicit { repeated double values = 1 [packed = true]; }
    // Named begin/end rather than from/to: `from` is a keyword in
    // Python and several other generated languages, where the field
    // then becomes unreachable or is silently renamed.
    // `steps` counts points, not the gaps between them: begin and end are
    // both priced, so 41 from 80 to 120 is every whole number, and fewer
    // than two is refused.
    message Linear { double begin = 1; double end = 2; uint32 steps = 3; }
    // Multipliers of the quote's current value: 0.8, 0.9, 1.0 ...
    message Relative { repeated double factors = 1 [packed = true]; }

    // Which single result to shape into ScenarioResult.series or .surface.
    // Leave unset to get the full PriceResult per point and no plot.
    //
    // A property of the sweep rather than of an axis: set it on the first one.
    // Set on a later axis it is refused, because the alternative is picking
    // one silently and drawing a plot of something the client did not ask for.
    ResultKind plot = 5;

    // Leave this quote at the last swept value instead of restoring it. Per
    // axis, because leaving spot where the sweep ended while putting vol back
    // is a coherent thing to want.
    //
    // Phrased this way round because proto3 defaults it to false, and the
    // default has to be the safe one: a sweep is a question, not an edit, and
    // a client that has to remember to ask for the undo will forget.
    bool keep_final_value = 6;
}

// Several trades against one graph, in one frame.
//
// A book of forty trades was forty requests: forty round trips serialised on
// the one worker the session owns, forty terminal frames to match up, and no
// way to stop the lot. The market is the same for all of them and the graph is
// already warm, so the only thing forty frames bought was forty chances to
// interleave something else.
//
// Entries are priced in the order given and answered in the same order, one
// for one, so a client matches by position and needs no ids of its own.
//
// A failing entry does not fail the batch. Refusing the whole thing because
// trade 17 names a curve that is not there would throw away thirty-nine prices
// that were computed correctly -- the same argument that made an unsupplied
// result a named absence rather than a rejection. The exception is a failure
// that dirties the graph: after that nothing later in the batch is trustworthy,
// and the remaining entries are answered with what stopped them rather than
// with a price computed against a half-invalidated graph.
// A sweep inside a batch is refused rather than served. Both shapes already
// mean "price this many times", and nesting them is a product with no honest
// reply: the progress stream cannot say which entry it is on and which point
// within it with one completed/total pair. A book of sweeps is a book of sweep
// requests, which is what it was before.
message PriceBatch {
    repeated PriceRequest requests = 1;
}

message CancelRequest {
    // The request_id to cancel. The cancel itself gets its own terminal Ack,
    // because nothing downstream answers it.
    uint64 target_request_id = 1;
}

// ---------------------------------------------------------------------------
// Non-terminal and terminal replies
// ---------------------------------------------------------------------------

message Progress {
    uint64 completed = 1;
    uint64 total = 2;
    // The latest number: a batched Monte Carlo's running mean, a sweep's price
    // at the point just finished, a batch's NPV for the entry just finished.
    // Unset when there is none -- a batch entry that failed -- because 0 is a
    // price.
    optional double running_npv = 3;
    // The standard error of running_npv, for a client that would stop early on
    // its own terms. No engine in this build reports one mid-run, so it is
    // never set; optional so that its absence cannot read as an error of zero.
    optional double running_standard_error = 4;
    // Sweeps only: the index into ScenarioResult.prices of the point just
    // priced. Optional because 0 is the first point.
    optional uint32 scenario_point = 5;
}

message Ack {}

message Error {
    enum Code {
        CODE_UNSPECIFIED = 0;
        INVALID_ARGUMENT = 1;
        SESSION_NOT_FOUND = 2;
        UNKNOWN_ID = 3;            // a quote, curve or index id that is not there
        UNSUPPORTED = 4;           // a shape the service knows of and cannot build
        BOOTSTRAP_FAILED = 5;
        CALCULATION_FAILED = 6;
        CANCELLED = 7;
        WORKER_DIED = 8;
        OVERLOADED = 9;
        INTERNAL = 10;
        // A *_UNSPECIFIED enum reached the registry. Its own code because it
        // is the one client mistake proto3 cannot make impossible, and the
        // frontend's fix for it is different: fill the field in, rather than
        // correct the value in it.
        UNSPECIFIED_ENUM = 11;
    }
    Code code = 1;

    string message = 2;

    // Dotted proto path of the field at fault:
    // "instrument.option.barrier.level", "engine.fd.custom". The frontend
    // highlights it. Empty when the failure came from the maths rather than
    // from a field, which is the honest answer for a bootstrap that did not
    // converge.
    string field_path = 3;

    // Set when the id in field_path was not found, so the frontend can offer
    // the ids that were.
    repeated string known_ids = 4;
}

// ---------------------------------------------------------------------------
// The handshake
// ---------------------------------------------------------------------------

// Asks the service what it can price.
//
// A request rather than something pushed on connect, because everything else
// here is a request: one ClientFrame in, one terminal ServerFrame out,
// correlated by request_id. An unsolicited frame would be the only one a
// client could not account for, and would need a request_id nobody chose.
//
// It carries no fields. Asking is the whole message, and a version negotiation
// this service does not perform would be a field that lies.
message Hello {}

// One reply for a whole book: one entry per PriceBatch.requests, in order.
message BatchResult {
    repeated Entry entries = 1;

    message Entry {
        // Exactly one. An entry that failed carries the rejection it would have
        // been sent on its own, field_path and all, so a blotter can put the
        // complaint on the row it belongs to.
        oneof outcome {
            PriceResult price = 1;
            Error error = 2;
        }
    }

    // How many entries were attempted before a failure dirtied the graph and
    // the rest of the book was abandoned; zero when the whole book was priced.
    // A count rather than an index, so "the first entry broke it" is 1 and not
    // indistinguishable from the ordinary case.
    //
    // The entries are all present either way. This says that the errors from
    // here on are consequences rather than diagnoses.
    uint32 abandoned_after = 2;
}

// What this build prices, as data.
//
// The schema describes more than any build implements, and the difference has
// until now lived in prose (ql-backend/doc/HANDLERS.md) and been copied by
// hand into each client. A copy drifts the first time a lattice tree is added,
// and it drifts silently: the client goes on offering something the service
// will refuse, or hides something it would now accept.
//
// These are *sets*, not a matrix. Whether an analytic barrier takes an
// American exercise is a rule about a combination, and there are far more
// combinations than are worth putting on the wire; a client still needs its
// own table for those. What this closes is the drift that actually happens,
// which is a value appearing in or disappearing from one of these lists.
//
// Several fields are strings because what they name is not an enum: `style`,
// `payoff`, `kind` and `shape` are proto oneofs, and their arm names are the
// only stable way to refer to them.
message Capabilities {
    // Free-text, for a client to show and a bug report to quote.
    string build = 1;
    string quantlib_version = 2;

    // Instrument.kind arms that are dispatched, e.g. "option", "swap".
    repeated string instruments = 3;
    // Option.style arms that are built, e.g. "vanilla", "barrier".
    repeated string option_styles = 4;
    // Payoff.kind arms that are built, e.g. "plain", "cash_or_nothing".
    repeated string payoffs = 5;

    repeated Exercise.Type exercises = 6;
    repeated Underlying.Process processes = 7;
    repeated Engine.Method engine_methods = 8;
    repeated LatticeParameters.Tree lattice_trees = 9;
    repeated AnalyticParameters.Approximation approximations = 10;
    repeated FdParameters.Preset fd_presets = 11;

    // The ResultKinds this build maps. Asking for one outside this set is a
    // rejection on some paths and an absent key on others, and neither is
    // something a client should have to discover by trying.
    repeated ResultKind result_kinds = 12;

    // MarketObject.kind arms that are built, e.g. "quote", "yield_curve".
    repeated string market_kinds = 13;
    // YieldCurve.shape arms, e.g. "flat", "bootstrap".
    repeated string yield_curve_shapes = 14;
    // VolatilitySurface.shape arms, e.g. "constant".
    repeated string volatility_shapes = 15;

    repeated Index.Family index_families = 16;
    repeated Pillar.Kind pillar_kinds = 17;
    repeated BootstrappedCurve.Traits bootstrap_traits = 18;
    repeated Interpolator bootstrap_interpolators = 19;
    repeated Leg.Kind leg_kinds = 20;

    // PriceRequest options this build honours. "include_additional_results"
    // today; "include_cashflows" and "curve_samples" appear here when they are
    // implemented, which is how a client learns it may offer them.
    repeated string price_request_options = 21;

    // ClientFrame payload arms this build serves, e.g. "price", "batch". A
    // frame is not a PriceRequest option and does not belong in the list above:
    // this is how a client learns it may send a whole book at once rather than
    // discovering it by sending one and reading the rejection.
    repeated string frames = 23;

    // The most points one sweep may hold, counting the product of its axes.
    // A grid multiplies, so a mistyped step count is not a slow request but a
    // session-length one; the limit is advertised so a client can refuse it
    // before spending the round trip.
    uint32 max_scenario_points = 22;

    // The most trades one PriceBatch may carry. The sweep ceiling's sibling:
    // a frame can hold tens of thousands of Monte Carlos, each of which runs
    // to completion on the seat it starts on, and a blotter is tens of rows.
    uint32 max_batch_entries = 24;

    // The most points one CurveSample may ask for. Each point is a
    // term-structure query on the live graph, so a sample past what a chart
    // can show is a request in its own right rather than a decoration on one.
    uint32 max_curve_sample_points = 25;
}

// The solve behind RESULT_KIND_IMPLIED_VOLATILITY.
//
// Inverting a price is a root find, so it takes a target and the bracket to
// look in. QuantLib supplies defaults for everything except the target, and a
// zero here means "QuantLib's", which is the same treatment
// McParameters.time_steps_per_year gets: these are controls on how hard to
// look, not terms of the trade, and a wrong one costs iterations rather than
// correctness.
//
// Available where QuantLib can invert -- a vanilla, a barrier, a double
// barrier. Asked of a style that cannot, the kind comes back in
// PriceResult.unavailable_results like any other result an engine could not
// supply.
message ImpliedVolatility {
    // The price to invert. Required, and positive.
    double target_price = 1;

    double accuracy = 2;
    uint32 max_evaluations = 3;
    double min_volatility = 4;
    double max_volatility = 5;
}
